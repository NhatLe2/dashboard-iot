<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Giám Sát Nông Nghiệp</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: auto; }
        
        .header-box { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
        .status-badge { padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; background: #e74c3c; color: white; transition: 0.3s; }
        .status-connected { background: #2ecc71; }

        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .grid-responsive { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        
        .value-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 5px solid #3498db; }
        .value-box h3 { margin: 0; font-size: 14px; color: #7f8c8d; }
        .value-box p { margin: 5px 0 0; font-size: 24px; font-weight: bold; color: #2c3e50; }
        
        .btn-group { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 10px 10px; font-size: 15px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; }
        .btn-on { background: #2ecc71; } .btn-off { background: #e74c3c; }
        .btn-mode { background: #3498db; }
        button:active { transform: scale(0.95); }

        /* FIX 1: Canvas wrapper để height hoạt động đúng với maintainAspectRatio: false */
        .chart-wrapper { position: relative; height: 350px; }

        /* Toast notification */
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 15px; opacity: 0; transition: opacity 0.5s, bottom 0.5s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1 style="color: #2c3e50; margin: 0; text-align: left; font-size: 24px;">Trạm Điều Khiển Cục Bộ (Edge Gateway)</h1>
            <div id="mqtt-status" class="status-badge">🔴 Đang ngắt kết nối MQTT</div>
        </div>
        
        <div class="card">
            <h2 style="margin-top:0; color:#34495e; text-align: left; font-size: 18px;">Trạng Thái Thời Gian Thực (Live)</h2>
            <div class="grid-responsive">
                <div class="value-box" style="border-color: #e74c3c;">
                    <h3>Nhiệt Độ (AHT10)</h3><p><span id="rt-temp">--</span> °C</p>
                </div>
                <div class="value-box" style="border-color: #3498db;">
                    <h3>Độ Ẩm KK (AHT10)</h3><p><span id="rt-hum">--</span> %</p>
                </div>
                <div class="value-box" style="border-color: #2ecc71;">
                    <h3>Độ Ẩm Đất</h3><p><span id="rt-soil">--</span> %</p>
                </div>
            </div>
            
            <h2 style="margin: 20px 0 10px 0; color:#34495e; text-align: left; font-size: 18px;">Bảng Điều Khiển Thiết Bị Chấp Hành</h2>
            <div class="grid-responsive">
                <div class="value-box" style="border-color: #f1c40f;">
                    <h3>Bơm Nước</h3>
                    <div class="btn-group">
                        <button class="btn-on" onclick="sendControl('pump', 1)">BẬT</button>
                        <button class="btn-off" onclick="sendControl('pump', 0)">TẮT</button>
                    </div>
                </div>
                <div class="value-box" style="border-color: #9b59b6;">
                    <h3>Quạt Tản Nhiệt</h3>
                    <div class="btn-group">
                        <button class="btn-on" onclick="sendControl('fan', 1)">BẬT</button>
                        <button class="btn-off" onclick="sendControl('fan', 0)">TẮT</button>
                    </div>
                </div>
                <div class="value-box" style="border-color: #34495e;">
                    <h3>Chế Độ Hoạt Động</h3>
                    <div class="btn-group">
                        <button class="btn-mode" onclick="sendControl('auto', 1)">AUTO</button>
                        <button class="btn-mode" style="background:#7f8c8d;" onclick="sendControl('auto', 0)">MANUAL</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 style="margin-top:0; color:#34495e; text-align: left; font-size: 18px;">Biểu Đồ Lịch Sử (Đồng bộ Supabase)</h2>
            <!-- FIX 1: Bọc canvas trong wrapper có height cố định -->
            <div class="chart-wrapper">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>

    <div id="toast">Thông báo hệ thống</div>

    <script>
        // ==========================================
        // HÀM UI: HIỂN THỊ TOAST NOTIFICATION
        // FIX 4: Thêm clearTimeout để tránh race condition
        // ==========================================
        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            clearTimeout(toastTimer); // Hủy timer cũ nếu có
            toastTimer = setTimeout(() => { toast.className = ""; }, 3000);
        }

        // ==========================================
        // 1. KẾT NỐI MQTT (ĐIỀU KHIỂN & XEM LIVE)
        // ==========================================
        const clientId = 'web_' + Math.random().toString(16).slice(2, 10);
        const mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: clientId, clean: true });

        const TOPIC_SENSOR = 'DoAn_EE3183_NhatLe/sensors';
        const TOPIC_CONTROL = 'DoAn_EE3183_NhatLe/control';
        const statusBadge = document.getElementById('mqtt-status');

        mqttClient.on('connect', function () {
            console.log('✅ Đã kết nối MQTT Broker thành công!');
            statusBadge.innerText = '🟢 Đã kết nối mạng biên';
            statusBadge.classList.add('status-connected');
            mqttClient.subscribe(TOPIC_SENSOR);
        });

        mqttClient.on('offline', function () {
            statusBadge.innerText = '🔴 Đang ngắt kết nối MQTT';
            statusBadge.classList.remove('status-connected');
        });

        mqttClient.on('error', function (error) {
            console.error('Lỗi giao thức MQTT:', error);
            showToast("Lỗi kết nối hạ tầng mạng!");
        });

        mqttClient.on('message', function (topic, message) {
            if (topic === TOPIC_SENSOR) {
                try {
                    const data = JSON.parse(message.toString());
                    // FIX 2: Dùng ?? thay || để fallback đúng khi giá trị hợp lệ là 0
                    document.getElementById('rt-temp').innerText = (data.t ?? 0).toFixed(1);
                    document.getElementById('rt-hum').innerText  = (data.h ?? 0).toFixed(1);
                    document.getElementById('rt-soil').innerText = (data.s ?? 0).toFixed(1);
                } catch (e) {
                    console.error("Lỗi phân giải gói tin JSON:", e);
                }
            }
        });

        function sendControl(device, state) {
            if (!mqttClient.connected) {
                showToast("Cảnh báo: Chưa kết nối hệ thống mạng!");
                return;
            }
            const payload = JSON.stringify({ device: device, state: state });
            mqttClient.publish(TOPIC_CONTROL, payload, { qos: 1 });
            
            const deviceName = device === 'pump' ? 'Bơm' : (device === 'fan' ? 'Quạt' : 'Chế độ Auto');
            const stateName = state === 1 ? 'BẬT' : 'TẮT';
            showToast(`Đã phát lệnh: ${deviceName} ➔ ${stateName}`);
        }

        // ==========================================
        // 2. BIỂU ĐỒ SUPABASE VÀ XỬ LÝ MEMORY LEAK
        // ==========================================
        const SUPABASE_URL = 'https://jlumfhzlpvbujfcwshtg.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_5a6Ugo0f9VlMBA6w8AFgvA_7BsYZ47W'; 
        const TABLE_NAME = 'nong_nghiep_data'; 
        
        let chartInstance = null;

        async function fetchDataAndDraw() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=*&order=created_at.desc&limit=20`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                
                if (!response.ok) throw new Error("Lỗi xác thực API");
                const data = await response.json();
                data.reverse();

                const labels = data.map(item => new Date(item.created_at).toLocaleTimeString('vi-VN'));
                const temps  = data.map(item => item.temperature);
                const hums   = data.map(item => item.humidity);    // FIX 3: Đã thêm vào dataset
                const soils  = data.map(item => item.soil_moisture);

                const ctx = document.getElementById('myChart').getContext('2d');
                
                if (chartInstance) {
                    chartInstance.destroy();
                }

                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Nhiệt độ (°C)',
                                data: temps,
                                borderColor: '#e74c3c',
                                backgroundColor: 'rgba(231, 76, 60, 0.1)',
                                tension: 0.4,
                                fill: true
                            },
                            {
                                label: 'Độ ẩm KK (%)',   // FIX 3: Dataset humidity được dùng
                                data: hums,
                                borderColor: '#3498db',
                                backgroundColor: 'rgba(52, 152, 219, 0.1)',
                                tension: 0.4,
                                fill: true
                            },
                            {
                                label: 'Độ ẩm Đất (%)',
                                data: soils,
                                borderColor: '#2ecc71',
                                backgroundColor: 'rgba(46, 204, 113, 0.1)',
                                tension: 0.4,
                                fill: true
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false  // FIX 1: Hoạt động đúng nhờ chart-wrapper có height
                    }
                });
            } catch (error) { 
                console.error("Lỗi đồng bộ dữ liệu đồ thị:", error);
            }
        }
        
        fetchDataAndDraw();
        setInterval(fetchDataAndDraw, 300000); // Tự động làm mới mỗi 5 phút
    </script>
</body>
</html>
